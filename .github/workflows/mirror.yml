name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to GitLab
        run: |
          git remote add gitlab https://oauth2:${GITLAB_TOKEN}@git-lab.kosmoslogistic.ru/ambar/ambar-api.git
          git push gitlab --mirror
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}